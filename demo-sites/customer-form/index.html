<!doctype html>
<html lang="en">
<head><meta charset="utf-8" /><title>Customer Form</title>
<style>body{font-family:system-ui,sans-serif;background:#f4f6f8;padding:32px}form{max-width:480px;background:#fff;border:1px solid #e2e8f0;border-radius:12px;padding:24px}input,textarea{width:100%;padding:8px;margin-top:4px;border:1px solid #cbd5e1;border-radius:8px}button{margin-top:12px;padding:10px 16px;border-radius:8px;border:0;background:#0f766e;color:#fff}</style>
</head>
<body>
<form>
<h1>New customer</h1>
<label for="name">Name</label><input id="name" name="name" />
<label for="email">Email</label><input id="email" name="email" />
<label for="notes">Notes</label><textarea id="notes" rows="3"></textarea>
<button id="save-btn" type="button">Save</button>
<div id="status"></div>
</form>
<script>document.getElementById('save-btn').addEventListener('click',()=>{document.getElementById('status').textContent='Saved.';});</script>
</body>
</html>
